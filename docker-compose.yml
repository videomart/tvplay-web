services:
  postgres:
    image: postgres:16-alpine
    container_name: tvplay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tvplay
      POSTGRES_USER: tvplay
      POSTGRES_PASSWORD: tvplay123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tvplay']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tvplay_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tvplay_minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - miniodata:/data
      # ── OPÇÃO A: pasta local no host (ex: disco externo ou NAS via SMB montado no host) ──
      # Comente o volume "miniodata:/data" acima e descomente a linha abaixo:
      # - /mnt/nas/tvplay-media:/data
      #
      # ── OPÇÃO B: NFS diretamente pelo Docker (sem montar no host) ──
      # Substitua o volume "miniodata" na seção volumes abaixo por:
      #   miniodata:
      #     driver: local
      #     driver_opts:
      #       type: nfs
      #       o: addr=192.168.1.100,rw,nfsvers=4,hard
      #       device: ":/caminho/no/servidor/nfs"
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3
  # ── OPÇÃO C: MinIO externo / S3 ──────────────────────────────────────────────
  # Se usar MinIO externo na LAN ou serviço S3 (AWS, Wasabi, Backblaze B2),
  # remova o serviço "minio" acima e ajuste no serviço "api" as variáveis:
  #   MINIO_ENDPOINT: 192.168.1.200       # IP ou hostname do MinIO/S3
  #   MINIO_PORT: '9000'                  # porta do serviço
  #   MINIO_ACCESS_KEY: seu-access-key
  #   MINIO_SECRET_KEY: seu-secret-key
  #   MINIO_USE_SSL: 'false'              # 'true' para HTTPS
  #   MINIO_BUCKET: tvplay-media
  # Para AWS S3: MINIO_ENDPOINT: s3.amazonaws.com · MINIO_USE_SSL: 'true'
  # ─────────────────────────────────────────────────────────────────────────────

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tvplay_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tvplay:tvplay123@postgres:5432/tvplay
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_USE_SSL: 'false'
      MINIO_BUCKET: tvplay-media
      NODE_ENV: production
      JWT_SECRET: tvplay-dev-secret-change-in-production
      JWT_EXPIRES_IN: 8h
      # Cookies do YouTube — necessário em IPs de datacenter/VPS
      # Exporte via extensão "Get cookies.txt LOCALLY" (Chrome) ou "cookies.txt" (Firefox)
      YTDLP_COOKIES_FILE: /app/youtube-cookies.txt
    ports:
      - '3001:3001'
      - '4000-4020:4000-4020/udp'  # SRT / UDP listener (21 portas — suficiente para múltiplos streams)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - media_storage:/app/storage
      # Cookies do YouTube — montado como leitura/escrita para que yt-dlp possa atualizá-los
      - ./youtube-cookies.txt:/app/youtube-cookies.txt
    privileged: true
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        CACHE_BUST: ${CACHE_BUST:-0}
    container_name: tvplay_web
    restart: unless-stopped
    ports:
      - '3000:80'   # acesso direto local (sem SSL)
    environment:
      VIRTUAL_HOST: vps.avideomart.com.br
      VIRTUAL_PORT: '80'
      LETSENCRYPT_HOST: vps.avideomart.com.br
      LETSENCRYPT_EMAIL: bolais@videomart.com.br
    depends_on:
      - api

  # ── Proxy reverso HTTPS com Let's Encrypt automático ────────────────────────
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: tvplay_proxy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - ./nginx-proxy-conf/upload.conf:/etc/nginx/conf.d/upload.conf:ro

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: tvplay_acme
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    environment:
      - NGINX_PROXY_CONTAINER=tvplay_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx-certs:/etc/nginx/certs
      - nginx-vhost:/etc/nginx/vhost.d
      - nginx-html:/usr/share/nginx/html
      - acme-state:/etc/acme.sh
  # ─────────────────────────────────────────────────────────────────────────────

volumes:
  pgdata:
  miniodata:
  media_storage:
  nginx-certs:
  nginx-vhost:
  nginx-html:
  acme-state:
